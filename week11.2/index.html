<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-face-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene mindar-face="filterMinCF:0.0001; filterBeta:0.001" embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- Точка 10 — це верх лоба, вона зазвичай найстабільніша -->
        <a-entity mindar-face-target="anchorIndex: 10">
            <a-entity 
                mindar-face-mesh 
                material="color: #00ff00; opacity: 0.8; transparent: true; wireframe: true; wireframeLinewidth: 2">
            </a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
