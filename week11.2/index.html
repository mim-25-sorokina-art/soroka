<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MindAR Face — тест маски</title>
  <style>
    body{margin:0;background:#0b1220;color:#e6eef8;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
    #app{width:900px;max-width:96%}
    #loading{margin:8px 0;color:#cfe8ff}
    #controls{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    button{padding:8px 12px;border-radius:8px;border:none;background:#2b6cff;color:#fff;cursor:pointer}
    #log{margin-top:10px;background:#071022;padding:10px;border-radius:8px;color:#cfe8ff;white-space:pre-wrap;max-height:180px;overflow:auto}
    a-scene{width:100%;height:560px;display:block}
  </style>
  <!-- A-Frame і MindAR (CDN) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-face-aframe.prod.js"></script>
</head>
<body>
  <div id="app">
    <h3>MindAR Face — тест сірої маски</h3>
    <div id="loading">Натисни «Запустити AR», щоб дозволити камеру і стартувати маску.</div>

    <div id="controls">
      <button id="startBtn">Запустити AR</button>
      <button id="stopBtn" disabled>Зупинити AR</button>
      <div style="margin-left:auto;color:#9aa6c0">Працює на HTTPS або localhost</div>
    </div>

    <!-- Сцена MindAR Face -->
    <a-scene
      id="scene"
      mindar-face
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      style="background: #000;">
      
      <!-- Камера (неактивна, MindAR керує камерою) -->
      <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Ціль: anchorIndex: 1 (маска на обличчі) -->
      <a-entity mindar-face-target="anchorIndex: 1">
        <a-entity
          mindar-face-mesh
          material="color: #808080; opacity: 0.7; transparent: true; side:double">
        </a-entity>
      </a-entity>

    </a-scene>

    <div id="log">Логи зʼявляться тут</div>
  </div>

<script>
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const logEl = document.getElementById('log');
  const sceneEl = document.querySelector('#scene');

  function log(msg, isError=false){
    const time = new Date().toLocaleTimeString();
    const line = `[${time}] ${msg}\n`;
    logEl.textContent = line + logEl.textContent;
    if (isError) logEl.style.color = '#ffb3b3';
  }

  // Безпечний виклик start/stop для MindAR
  async function startMindAR(){
    try {
      log('Спроба запустити MindAR і отримати доступ до камери...');
      // mindar-face компонент додається як компонент сцени
      const mindarComp = sceneEl.components['mindar-face'];
      if (!mindarComp){
        log('Компонент mindar-face не знайдено на сцені. Перевір підключення скриптів.', true);
        return;
      }
      // start() повертає проміс
      await mindarComp.start();
      log('MindAR запущено — камера активна.');
      startBtn.disabled = true;
      stopBtn.disabled = false;
    } catch (err) {
      console.error(err);
      log('Помилка при старті MindAR: ' + (err && err.message ? err.message : err), true);
      // детальні підказки
      if (err.name === 'NotAllowedError') log('Дозвіл на камеру відхилено. Дозволь камеру в налаштуваннях сайту.', true);
      if (err.name === 'NotFoundError') log('Камера не знайдена. Перевір підключення пристрою.', true);
    }
  }

  async function stopMindAR(){
    try {
      const mindarComp = sceneEl.components['mindar-face'];
      if (mindarComp) await mindarComp.stop();
      log('MindAR зупинено.');
    } catch (err) {
      console.error(err);
      log('Помилка при зупинці MindAR: ' + (err && err.message ? err.message : err), true);
    } finally {
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }
  }

  startBtn.addEventListener('click', async () => {
    // user gesture — необхідний для дозволу камери в багатьох браузерах
    await startMindAR();
  });
  stopBtn.addEventListener('click', async () => {
    await stopMindAR();
  });

  // Ловимо помилки A-Frame / MindAR
  window.addEventListener('error', (e) => {
    log('Глобальна помилка: ' + e.message, true);
  });
  window.addEventListener('unhandledrejection', (e) => {
    log('Unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), true);
  });

  // Додатково: лог подій сцени
  sceneEl.addEventListener('loaded', () => log('A-Frame сцена завантажена.'));
  sceneEl.addEventListener('renderstart', () => log('A-Frame рендер стартував.'));
  sceneEl.addEventListener('arReady', () => log('AR готовий (arReady).'));
  sceneEl.addEventListener('arError', (ev) => log('AR помилка: ' + JSON.stringify(ev.detail), true));
</script>
</body>
</html>
