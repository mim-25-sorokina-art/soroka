<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 11.2 - Grey Face Mesh</title>
    <!-- Використовуємо стабільну комбінацію бібліотек -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-face-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        /* Повідомлення для користувача, поки вантажиться ШІ */
        #loading-text {
            position: absolute; width: 100%; top: 50%; text-align: center;
            color: white; font-family: Arial, sans-serif; z-index: 999;
        }
    </style>
</head>
<body>
    <div id="loading-text">Зачекайте, ШІ малює сітку...</div>

    <a-scene 
        mindar-face 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Цей блок відповідає за ТУ САМУ сіру маску -->
        <a-entity mindar-face-target="anchorIndex: 1">
            <a-entity 
                mindar-face-mesh 
                material="color: #808080; opacity: 0.6; transparent: true; wireframe: false">
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        // Коли система AR готова, прибираємо напис
        document.querySelector('a-scene').addEventListener("arReady", (event) => {
           document.querySelector('#loading-text').style.display = 'none';
        });
    </script>
</body>
</html>
