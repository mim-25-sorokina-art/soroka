<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 11.2 - Final Fix</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
    <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
    <!-- Додано filterMinCF та filterBeta для стабільності, а також автоматичне налаштування камери -->
    <a-scene mindar-face="filterMinCF:0.001; filterBeta: 10" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Сутність для сітки -->
        <a-entity mindar-face-target="anchorIndex: 168">
            <a-entity mindar-face-mesh material="wireframe: true; color: #444444"></a-entity>
        </a-entity>

        <!-- Точки на очах -->
        <a-entity mindar-face-target="anchorIndex: 374">
            <a-sphere color="white" radius="0.015"></a-sphere>
        </a-entity>
        <a-entity mindar-face-target="anchorIndex: 145">
            <a-sphere color="white" radius="0.015"></a-sphere>
        </a-entity>

    </a-scene>
</body>
</html>
