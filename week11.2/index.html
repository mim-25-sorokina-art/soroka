<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 11.2 - Final Test</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-face-aframe.prod.js"></script>
    <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
    <a-scene mindar-face="faceMesh: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-camera active="false" position="0 0 0"></a-camera>

        <a-entity mindar-face-target="anchorIndex: 168">
            <!-- Колір змінено на зелений для перевірки, wireframe увімкнено -->
            <a-entity mindar-face-mesh material="wireframe: true; color: #00ff00"></a-entity>
        </a-entity>

        <a-entity mindar-face-target="anchorIndex: 374">
            <a-sphere color="white" radius="0.01"></a-sphere>
        </a-entity>
        <a-entity mindar-face-target="anchorIndex: 145">
            <a-sphere color="white" radius="0.01"></a-sphere>
        </a-entity>
    </a-scene>
</body>
</html>
