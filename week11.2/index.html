<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 11.2 - Final Stable Version</title>
    <!-- Використовуємо перевірені версії бібліотек -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-face-aframe.prod.js"></script>
    <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
    <!-- mindar-face автоматично ініціалізує систему відстеження -->
    <a-scene mindar-face vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- Сутність, яка відображає саму сітку обличчя -->
        <a-entity mindar-face-target="anchorIndex: 1">
            <!-- wireframe: true створює саме той ефект сітки, як у відео -->
            <a-entity mindar-face-mesh material="wireframe: true; color: #444444"></a-entity>
        </a-entity>

        <!-- Білі сфери на очах -->
        <a-entity mindar-face-target="anchorIndex: 374">
            <a-sphere color="white" radius="0.015"></a-sphere>
        </a-entity>
        <a-entity mindar-face-target="anchorIndex: 145">
            <a-sphere color="white" radius="0.015"></a-sphere>
        </a-entity>

    </a-scene>
</body>
</html>
