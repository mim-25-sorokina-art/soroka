<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Авто-камера + маска (MediaPipe)</title>
  <style>
    :root{--bg:#0f1720;--panel:#0b1220;--accent:#2b6cff;--muted:#9aa6c0}
    html,body{height:100%;margin:0;background:var(--bg);color:#e6eef8;font-family:Inter,Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
    .card{width:880px;max-width:96%;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border-radius:12px;padding:14px;box-shadow:0 6px 30px rgba(2,6,23,0.6)}
    h3{margin:6px 0 12px 0;font-weight:600}
    #container{position:relative;border-radius:8px;overflow:hidden;background:#000}
    video{display:none}
    canvas{display:block;width:100%;height:auto;background:#000}
    .toolbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
    button{background:var(--accent);border:none;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.secondary{background:#2b2f3a}
    .status{margin-left:auto;color:var(--muted);font-size:13px}
    .badge{display:inline-block;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,0.04);font-size:13px}
    .hint{color:var(--muted);font-size:13px;margin-top:8px}
    label{font-size:13px;color:var(--muted)}
    input[type=color]{width:44px;height:34px;border:0;padding:0;background:none;cursor:pointer}
    input[type=range]{width:140px}
  </style>
</head>
<body>
  <div class="card">
    <h3>Автоматичне виявлення обличчя і маска</h3>
    <div id="container">
      <video id="video" playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="toolbar">
      <label>Колір маски: <input id="maskColor" type="color" value="#ff66aa"></label>
      <label>Альфа: <input id="alpha" type="range" min="0" max="1" step="0.01" value="0.6"></label>
      <label>Розмиття: <input id="blur" type="range" min="0" max="30" step="1" value="12"></label>
      <button id="startBtn">Запустити камеру</button>
      <button id="stopBtn" class="secondary">Зупинити</button>
      <div class="status"><span id="faceStatus" class="badge">Обличчя: невиявлено</span></div>
    </div>

    <div class="hint">Дозволь доступ до камери. Якщо автозапуск заблоковано — натисни «Запустити камеру». Працює на HTTPS або localhost.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
