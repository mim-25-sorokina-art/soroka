<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-face-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene mindar-face embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-camera active="false" position="0 0 0"></a-camera>
        
        <a-entity mindar-face-target="anchorIndex: 10">
            <!-- Збільшуємо яскравість і товщину ліній сітки -->
            <a-entity 
                mindar-face-mesh 
                material="color: #00FF00; opacity: 1; transparent: false; wireframe: true; wireframeLinewidth: 5">
            </a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
