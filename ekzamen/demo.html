<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Екзамен - Геометричні фігури</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        /* Кнопка "Назад" поверх AR сцени */
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 999;
            padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; border-radius: 25px; font-weight: bold; font-family: sans-serif;
            text-decoration: none; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        /* Підказка для учня на екрані */
        .instruction-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 999; background: rgba(0, 0, 0, 0.7); color: white;
            padding: 10px 20px; border-radius: 20px; font-family: sans-serif;
            text-align: center; font-size: 0.9rem; pointer-events: none;
        }
    </style>
</head>
<body>

    <a href="./index.html" class="back-btn">⬅️ На головну</a>
    <div class="instruction-overlay">🎯 Наведіть камеру на маркер "А" та клікніть на куб для розгортки!</div>

<a-scene mindar-image="imageTargetSrc: https://raw.githubusercontent.com/mim-25-sorokina-art/soroka-/main/ekzamen/assets/markers/geometry.mind; uiScanning: yes;"
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false">
          <a-cursor id="cursor" raycaster="objects: .clickable"></a-cursor>
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
          <a-entity id="interactive-cube" position="0 0 0" rotation="20 45 0" scale="0.4 0.4 0.4">

      <a-entity mindar-image-target="targetIndex: 0">
          
          <a-entity id="interactive-cube" position="0 0 0" rotation="20 45 0">
              
              <a-plane id="face-front" position="0 0 0.25" width="0.5" height="0.5" material="color: #4CC3D9; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
              <a-plane id="face-back" position="0 0 -0.25" rotation="0 180 0" width="0.5" height="0.5" material="color: #4CC3D9; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
              <a-plane id="face-top" position="0 0.25 0" rotation="-90 0 0" width="0.5" height="0.5" material="color: #FFC65D; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
              <a-plane id="face-bottom" position="0 -0.25 0" rotation="90 0 0" width="0.5" height="0.5" material="color: #FFC65D; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
              <a-plane id="face-left" position="-0.25 0 0" rotation="0 -90 0" width="0.5" height="0.5" material="color: #7BCFA6; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
              <a-plane id="face-right" position="0.25 0 0" rotation="0 90 0" width="0.5" height="0.5" material="color: #7BCFA6; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
              
          </a-entity>

          <a-entity position="0 -0.6 0" rotation="0 0 0">
              <a-plane width="0.9" height="0.35" material="color: #111; opacity: 0.6; radius: 0.05;"></a-plane>
              <a-text value="V = a * a * a\nS = 6 * a * a" color="#FFF" align="center" position="0 0 0.01" scale="0.35 0.35 0.35" font="kelsonsans"></a-text>
          </a-entity>

      </a-entity>
    </a-scene>

    <script>
        AFRAME.registerComponent('interactive-fold', {
            init: function () {
                let el = this.el;
                let isFolded = true; // Стан: зібраний куб

                // Знаходимо всі грані нашого куба
                let fFront = document.querySelector('#face-front');
                let fBack = document.querySelector('#face-back');
                let fTop = document.querySelector('#face-top');
                let fBottom = document.querySelector('#face-bottom');
                let fLeft = document.querySelector('#face-left');
                let fRight = document.querySelector('#face-right');

                el.addEventListener('click', function () {
                    if (isFolded) {
                        // АНІМАЦІЯ РОЗГОРТКИ (розкладаємо грані в плоску викрійку)
                        fFront.setAttribute('animation', 'property: position; to: 0 -0.5 0; dur: 1000; easing: easeOutQuad');
                        fFront.setAttribute('animation__rot', 'property: rotation; to: 90 0 0; dur: 1000; easing: easeOutQuad');
                        
                        fBack.setAttribute('animation', 'property: position; to: 0 0.5 0; dur: 1000; easing: easeOutQuad');
                        fBack.setAttribute('animation__rot', 'property: rotation; to: -90 0 0; dur: 1000; easing: easeOutQuad');

                        fLeft.setAttribute('animation', 'property: position; to: -0.5 0 0; dur: 1000; easing: easeOutQuad');
                        fLeft.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 1000; easing: easeOutQuad');

                        fRight.setAttribute('animation', 'property: position; to: 0.5 0 0; dur: 1000; easing: easeOutQuad');
                        fRight.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 1000; easing: easeOutQuad');

                        fTop.setAttribute('animation', 'property: position; to: 0 0 0; dur: 1000; easing: easeOutQuad');
                        fTop.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 1000; easing: easeOutQuad');

                        fBottom.setAttribute('animation', 'property: position; to: 0 -1.0 0; dur: 1000; easing: easeOutQuad');
                        fBottom.setAttribute('animation__rot', 'property: rotation; to: 90 0 0; dur: 1000; easing: easeOutQuad');
                        
                        isFolded = false;
                    } else {
                        // ЗГОРТКА НАЗАД У КУБ
                        fFront.setAttribute('animation', 'property: position; to: 0 0 0.25; dur: 1000; easing: easeOutQuad');
                        fFront.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 1000; easing: easeOutQuad');

                        fBack.setAttribute('animation', 'property: position; to: 0 0 -0.25; dur: 1000; easing: easeOutQuad');
                        fBack.setAttribute('animation__rot', 'property: rotation; to: 0 180 0; dur: 1000; easing: easeOutQuad');

                        fLeft.setAttribute('animation', 'property: position; to: -0.25 0 0; dur: 1000; easing: easeOutQuad');
                        fLeft.setAttribute('animation__rot', 'property: rotation; to: 0 -90 0; dur: 1000; easing: easeOutQuad');

                        fRight.setAttribute('animation', 'property: position; to: 0.25 0 0; dur: 1000; easing: easeOutQuad');
                        fRight.setAttribute('animation__rot', 'property: rotation; to: 0 90 0; dur: 1000; easing: easeOutQuad');

                        fTop.setAttribute('animation', 'property: position; to: 0 0.25 0; dur: 1000; easing: easeOutQuad');
                        fTop.setAttribute('animation__rot', 'property: rotation; to: -90 0 0; dur: 1000; easing: easeOutQuad');

                        fBottom.setAttribute('animation', 'property: position; to: 0 -0.25 0; dur: 1000; easing: easeOutQuad');
                        fBottom.setAttribute('animation__rot', 'property: rotation; to: 90 0 0; dur: 1000; easing: easeOutQuad');

                        isFolded = true;
                    }
                });
            }
        });
    </script>
</body>
</html>
