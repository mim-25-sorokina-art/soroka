<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Екзамен - Геометричні фігури</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 999;
            padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; border-radius: 25px; font-weight: bold;
            text-decoration: none; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .instruction-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 999; background: rgba(0, 0, 0, 0.8); color: white;
            padding: 12px 24px; border-radius: 20px; text-align: center;
            font-size: 0.9rem; pointer-events: none; width: 80%; max-width: 400px;
        }
    </style>
</head>
<body>

    <a href="./index.html" class="back-btn">⬅️ На головну</a>
    <div class="instruction-overlay">🎯 Наведіть камеру на маркер та клікніть по екрану для розгортки куба!</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-marker type="pattern" url="./assets/markers/letter-a.patt" emitevents="true" id="marker">
            
            <a-entity id="interactive-cube" position="0 0.5 0" rotation="20 45 0" scale="1.4 1.4 1.4">
                <a-plane id="face-front" position="0 0 0.25" width="0.5" height="0.5" material="color: #4CC3D9; side: double; opacity: 0.85;" class="clickable"></a-plane>
                <a-plane id="face-back" position="0 0 -0.25" rotation="0 180 0" width="0.5" height="0.5" material="color: #4CC3D9; side: double; opacity: 0.85;" class="clickable"></a-plane>
                <a-plane id="face-top" position="0 0.25 0" rotation="-90 0 0" width="0.5" height="0.5" material="color: #FFC65D; side: double; opacity: 0.85;" class="clickable"></a-plane>
                <a-plane id="face-bottom" position="0 -0.25 0" rotation="90 0 0" width="0.5" height="0.5" material="color: #FFC65D; side: double; opacity: 0.85;" class="clickable"></a-plane>
                <a-plane id="face-left" position="-0.25 0 0" rotation="0 -90 0" width="0.5" height="0.5" material="color: #7BCFA6; side: double; opacity: 0.85;" class="clickable"></a-plane>
                <a-plane id="face-right" position="0.25 0 0" rotation="0 90 0" width="0.5" height="0.5" material="color: #7BCFA6; side: double; opacity: 0.85;" class="clickable"></a-plane>
            </a-entity>

            <a-entity position="0 0.1 0.8" rotation="-90 0 0">
                <a-plane width="1.2" height="0.4" material="color: #111; opacity: 0.8;"></a-plane>
                <a-text value="V = a * a * a\nS = 6 * a * a" color="#FFF" align="center" position="0 0 0.01" scale="0.5 0.5 0.5"></a-text>
            </a-entity>

        </a-marker>
    </a-scene>

    <script>
        // Надійна система розгортки, яка слухає кліки на кожну грань куба окремо
        let isFolded = true;

        const fFront = document.querySelector('#face-front');
        const fBack = document.querySelector('#face-back');
        const fTop = document.querySelector('#face-top');
        const fBottom = document.querySelector('#face-bottom');
        const fLeft = document.querySelector('#face-left');
        const fRight = document.querySelector('#face-right');

        const faces = document.querySelectorAll('.clickable');
        
        faces.forEach(face => {
            face.addEventListener('click', function (evt) {
                // Запобігаємо подвійним клікам
                evt.stopPropagation();
                
                if (isFolded) {
                    // Анімація повного розкладання граней в площину
                    fFront.setAttribute('animation', 'property: position; to: 0 -0.5 0; dur: 700; easing: easeOutBack');
                    fFront.setAttribute('animation__rot', 'property: rotation; to: 90 0 0; dur: 700; easing: easeOutBack');
                    
                    fBack.setAttribute('animation', 'property: position; to: 0 0.5 0; dur: 700; easing: easeOutBack');
                    fBack.setAttribute('animation__rot', 'property: rotation; to: -90 0 0; dur: 700; easing: easeOutBack');
                    
                    fLeft.setAttribute('animation', 'property: position; to: -0.5 0 0; dur: 700; easing: easeOutBack');
                    fLeft.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 700; easing: easeOutBack');
                    
                    fRight.setAttribute('animation', 'property: position; to: 0.5 0 0; dur: 700; easing: easeOutBack');
                    fRight.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 700; easing: easeOutBack');
                    
                    fTop.setAttribute('animation', 'property: position; to: 0 0 0; dur: 700; easing: easeOutBack');
                    fTop.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 700; easing: easeOutBack');
                    
                    fBottom.setAttribute('animation', 'property: position; to: 0 -1.0 0; dur: 700; easing: easeOutBack');
                    fBottom.setAttribute('animation__rot', 'property: rotation; to: 90 0 0; dur: 700; easing: easeOutBack');
                    isFolded = false;
                } else {
                    // Анімація згортання назад у куб
                    fFront.setAttribute('animation', 'property: position; to: 0 0 0.25; dur: 700; easing: easeOutBack');
                    fFront.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 700; easing: easeOutBack');
                    
                    fBack.setAttribute('animation', 'property: position; to: 0 0 -0.25; dur: 700; easing: easeOutBack');
                    fBack.setAttribute('animation__rot', 'property: rotation; to: 0 180 0; dur: 800; easing: easeOutBack');
                    
                    fLeft.setAttribute('animation', 'property: position; to: -0.25 0 0; dur: 700; easing: easeOutBack');
                    fLeft.setAttribute('animation__rot', 'property: rotation; to: 0 -90 0; dur: 700; easing: easeOutBack');
                    
                    fRight.setAttribute('animation', 'property: position; to: 0.25 0 0; dur: 700; easing: easeOutBack');
                    fRight.setAttribute('animation__rot', 'property: rotation; to: 0 90 0; dur: 700; easing: easeOutBack');
                    
                    fTop.setAttribute('animation', 'property: position; to: 0 0.25 0; dur: 700; easing: easeOutBack');
                    fTop.setAttribute('animation__rot', 'property: rotation; to: -90 0 0; dur: 700; easing: easeOutBack');
                    
                    fBottom.setAttribute('animation', 'property: position; to: 0 -0.25 0; dur: 700; easing: easeOutBack');
                    fBottom.setAttribute('animation__rot', 'property: rotation; to: 90 0 0; dur: 700; easing: easeOutBack');
                    isFolded = true;
                }
            });
        });
    </script>
</body>
</html>
