<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Екзамен - Геометричні фігури</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 999;
            padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; border-radius: 25px; font-weight: bold; font-family: sans-serif;
            text-decoration: none; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .instruction-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 999; background: rgba(0, 0, 0, 0.8); color: white;
            padding: 12px 24px; border-radius: 20px; font-family: sans-serif;
            text-align: center; font-size: 0.9rem; pointer-events: none; width: 80%;
        }
    </style>
</head>
<body>

    <a href="./index.html" class="back-btn">⬅️ На головну</a>
    <div class="instruction-overlay">🎯 Наведіть камеру на маркер HIRO та клікніть на куб для розгортки!</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-camera gps-camera rotation-reader>
            <a-cursor id="cursor" raycaster="objects: .clickable"></a-cursor>
        </a-camera>

        <a-marker preset="hiro">
            
            <a-entity id="interactive-cube" position="0 0.5 0" rotation="20 45 0" scale="1.5 1.5 1.5">
                <a-plane id="face-front" position="0 0 0.25" width="0.5" height="0.5" material="color: #4CC3D9; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
                <a-plane id="face-back" position="0 0 -0.25" rotation="0 180 0" width="0.5" height="0.5" material="color: #4CC3D9; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
                <a-plane id="face-top" position="0 0.25 0" rotation="-90 0 0" width="0.5" height="0.5" material="color: #FFC65D; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
                <a-plane id="face-bottom" position="0 -0.25 0" rotation="90 0 0" width="0.5" height="0.5" material="color: #FFC65D; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
                <a-plane id="face-left" position="-0.25 0 0" rotation="0 -90 0" width="0.5" height="0.5" material="color: #7BCFA6; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
                <a-plane id="face-right" position="0.25 0 0" rotation="0 90 0" width="0.5" height="0.5" material="color: #7BCFA6; side: double; opacity: 0.8;" class="clickable" interactive-fold></a-plane>
            </a-entity>

            <a-entity position="0 0.1 0.8" rotation="-90 0 0">
                <a-plane width="1.2" height="0.4" material="color: #111; opacity: 0.8;"></a-plane>
                <a-text value="V = a * a * a\nS = 6 * a * a" color="#FFF" align="center" position="0 0 0.01" scale="0.5 0.5 0.5"></a-text>
            </a-entity>

        </a-marker>
    </a-scene>

    <script>
        // Компонент плавної анімації розгортки
        AFRAME.registerComponent('interactive-fold', {
            init: function () {
                let el = this.el;
                let isFolded = true;

                let fFront = document.querySelector('#face-front');
                let fBack = document.querySelector('#face-back');
                let fTop = document.querySelector('#face-top');
                let fBottom = document.querySelector('#face-bottom');
                let fLeft = document.querySelector('#face-left');
                let fRight = document.querySelector('#face-right');

                el.addEventListener('click', function () {
                    if (isFolded) {
                        fFront.setAttribute('animation', 'property: position; to: 0 -0.5 0; dur: 800; easing: easeOutQuad');
                        fFront.setAttribute('animation__rot', 'property: rotation; to: 90 0 0; dur: 800; easing: easeOutQuad');
                        fBack.setAttribute('animation', 'property: position; to: 0 0.5 0; dur: 800; easing: easeOutQuad');
                        fBack.setAttribute('animation__rot', 'property: rotation; to: -90 0 0; dur: 800; easing: easeOutQuad');
                        fLeft.setAttribute('animation', 'property: position; to: -0.5 0 0; dur: 800; easing: easeOutQuad');
                        fLeft.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 800; easing: easeOutQuad');
                        fRight.setAttribute('animation', 'property: position; to: 0.5 0 0; dur: 800; easing: easeOutQuad');
                        fRight.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 800; easing: easeOutQuad');
                        fTop.setAttribute('animation', 'property: position; to: 0 0 0; dur: 800; easing: easeOutQuad');
                        fTop.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 800; easing: easeOutQuad');
                        fBottom.setAttribute('animation', 'property: position; to: 0 -1.0 0; dur: 800; easing: easeOutQuad');
                        fBottom.setAttribute('animation__rot', 'property: rotation; to: 90 0 0; dur: 800; easing: easeOutQuad');
                        isFolded = false;
                    } else {
                        fFront.setAttribute('animation', 'property: position; to: 0 0 0.25; dur: 800; easing: easeOutQuad');
                        fFront.setAttribute('animation__rot', 'property: rotation; to: 0 0 0; dur: 800; easing: easeOutQuad');
                        fBack.setAttribute('animation', 'property: position; to: 0 0 -0.25; dur: 800; easing: easeOutQuad');
                        fBack.setAttribute('animation__rot', 'property: rotation; to: 0 180 0; dur: 800; easing: easeOutQuad');
                        fLeft.setAttribute('animation', 'property: position; to: -0.25 0 0; dur: 800; easing: easeOutQuad');
                        fLeft.setAttribute('animation__rot', 'property: rotation; to: 0 -90 0; dur: 800; easing: easeOutQuad');
                        fRight.setAttribute('animation', 'property: position; to: 0.25 0 0; dur: 800; easing: easeOutQuad');
                        fRight.setAttribute('animation__rot', 'property: rotation; to: 0 90 0; dur: 800; easing: easeOutQuad');
                        fTop.setAttribute('animation', 'property: position; to: 0 0.25 0; dur: 800; easing: easeOutQuad');
                        fTop.setAttribute('animation__rot', 'property: rotation; to: -90 0 0; dur: 800; easing: easeOutQuad');
                        fBottom.setAttribute('animation', 'property: position; to: 0 -0.25 0; dur: 800; easing: easeOutQuad');
                        fBottom.setAttribute('animation__rot', 'property: rotation; to: 90 0 0; dur: 800; easing: easeOutQuad');
                        isFolded = true;
                    }
                });
            }
        });
    </script>
</body>
</html>
