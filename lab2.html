<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"> <!-- -->
    <title>Лабораторна 2 — Сорокіна</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene stats> <!-- -->
        
        <a-assets>
            <!-- п. 6: Завантаження текстури (назва точно як на скріншоті) -->
            <img id="myTexture" src="images/texture.jpg">
            <!-- п. 6: Завантаження моделі (перевірте, щоб файл був у images/models/) -->
            <a-asset-item id="owlModel" src="images/models/owl.glb"></a-asset-item>
        </a-assets>

        <!-- п. 3.2.2: Прізвище. font вказує на ваш json файл -->
        <a-text 
            value="Сорокіна Єлизавета" 
            font="fonts/ukr-msdf.json" 
            negate="false" 
            color="#222" 
            width="10" 
            position="-2 3 -5">
        </a-text>

        <!-- КУЛЯ: Виправлено освітлення та анімацію обертання -->
        <a-sphere 
            position="-2 1.25 -5" 
            radius="1.25" 
            src="#myTexture"
            animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear"> <!-- -->
        </a-sphere>

        <!-- ЦИЛІНДР: Анімація кольору -->
        <a-cylinder 
            position="2 1 -5" 
            radius="0.5" 
            height="1.5" 
            color="#00BFFF"
            animation="property: material.color; from: #00BFFF; to: #FF00FF; dur: 4000; loop: true; dir: alternate"> <!-- -->
        </a-cylinder>

        <!-- п. 5.3: 3D-модель -->
        <a-entity 
            gltf-model="#owlModel" 
            position="0 0.5 -7" 
            scale="1 1 1">
        </a-entity>

        <!-- СВІТЛО: Цей блок зробить кулю кольоровою, а не чорною -->
        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" position="1 2 1" intensity="0.5"></a-light>

        <a-sky color="#87CEEB"></a-sky>
        <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#7BC8A4"></a-plane>
        
    </a-scene>
</body>
</html>
