<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Лабораторна 2 — Сорокіна Єлизавета</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <!-- stats додано для перевірки навантаження (п. 6 посібника) -->
    <a-scene stats>
        <a-assets>
            <!-- Шлях згідно з вашим зображення_34.png -->
            <img id="myTexture" src="images/texture.jpg">
            <!-- Модель у папці images/models/ -->
            <a-asset-item id="myModel" src="images/models/owl.glb"></a-asset-item>
        </a-assets>

        <!-- Прізвище (п. 3.2.2) -->
        <a-text 
            value="Сорокіна Єлизавета" 
            font="fonts/ukr-msdf.json" 
            negate="false" 
            color="#222" 
            width="8" 
            position="-2 3.5 -5">
        </a-text>

        <!-- КУЛЯ: тепер вона ПОВИННА бути кольоровою і обертатися (п. 4.3.2) -->
        <a-sphere 
            position="-2 1.5 -5" 
            radius="1" 
            src="#myTexture"
            animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
        </a-sphere>

        <!-- ЦИЛІНДР (п. 4.3.1) -->
        <a-cylinder 
            position="2 1.5 -5" 
            radius="0.5" 
            height="1.5" 
            color="#00BFFF"
            animation="property: material.color; from: #00BFFF; to: #FFD700; dur: 3000; loop: true; dir: alternate">
        </a-cylinder>

        <!-- Модель (п. 5.3) -->
        <a-entity gltf-model="#myModel" position="0 0.5 -7"></a-entity>

        <!-- ОСВІТЛЕННЯ (Виправляє чорну кулю) -->
        <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
        <a-light type="directional" position="1 2 1" intensity="0.5"></a-light>

        <a-sky color="#87CEEB"></a-sky>
        <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#7BC8A4"></a-plane>
    </a-scene>
</body>
</html>
