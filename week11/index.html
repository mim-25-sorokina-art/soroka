<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 11 - Final Mask</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <a-scene mindar-face vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <!-- Ваша картинка бантика -->
            <img id="maskTexture" src="./mask.png">
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- anchorIndex: 10 — це точка на лобі, під волоссям -->
        <a-entity mindar-face-target="anchorIndex: 10">
            <a-image src="#maskTexture" 
                     width="0.6" height="0.4" 
                     position="0 0.15 0.05" 
                     rotation="0 0 0"
                     transparent="true">
            </a-image>
        </a-entity>
    </a-scene>
</body>
</html>
