<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 11 - Face Mask</title>
    <!-- Підключення бібліотек A-Frame та MindAR для обличчя -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <!-- Ініціалізація сцени відстеження обличчя -->
    <a-scene mindar-face vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Використовуємо вашу назву файлу зі скриншота image_0eb57f.png -->
            <img id="maskTexture" src="./pngwing.com.png">
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- Прив'язка до верхньої частини лоба (точка 10) -->
        <a-entity mindar-face-target="anchorIndex: 10">
            <a-image src="#maskTexture" 
                     width="0.6" height="0.5" 
                     position="0 0.15 0.1" 
                     transparent="true">
            </a-image>
        </a-entity>

    </a-scene>
</body>
</html>
